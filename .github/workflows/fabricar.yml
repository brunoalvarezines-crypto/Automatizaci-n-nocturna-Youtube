name: Fabricar Shorts

on:
  repository_dispatch:
    types: [fabricar]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON con los vídeos (déjalo vacío para usar ejemplo.json)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: galeria
  cancel-in-progress: false

jobs:
  fabricar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q requests

      - name: Fabricar los Shorts
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VOZ: ${{ vars.VOZ || 'es-ES-AlvaroNeural' }}
          VELOCIDAD: ${{ vars.VELOCIDAD || '+8%' }}
          GALERIA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || inputs.payload }}
        run: python render.py

      - name: Publicar en la web
        if: always() && hashFiles('salida/meta.json') != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 --branch galeria "$REMOTO" web_actual 2>/dev/null || mkdir -p web_actual
          rm -rf web_actual/.git
          python galeria.py salida web_actual
          cd web_actual
          git init -q -b galeria
          git config user.name "turno-nocturno"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Galería $(date +%F)"
          git push -q -f "$REMOTO" galeria
